services:
  rrv7front:
    image: fullstack-project-dev
    volumes:
      - ./frontend/app:/usr/src/fullstack-project/frontend/app
      - ./frontend/package.json:/usr/src/fullstack-project/frontend/package.json
      - ./frontend/vite.config.ts:/usr/src/fullstack-project/frontend/vite.config.ts
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    networks:
      - fs-network
    container_name: rrv7front
  backend:
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    volumes:
      - ./backend/src:/usr/src/fullstack-project/backend/src
      - ./backend/prisma:/usr/src/fullstack-project/backend/prisma
      - ./backend/package.json:/usr/src/fullstack-project/backend/package.json
    ports:
      # API Endpoints
      - 8080:8080
      # Prisma Studio
      - 5555:5555
    networks:
      - fs-network
    container_name: backend
  postgres:
    image: postgres:17.4
    env_file:
      - ./postgres/.env
    volumes:
      - ./postgres/postgres_data:/var/lib/postgresql/data
    networks:
      - fs-network
    container_name: postgres
  reverseproxy:
    image: nginx:1.20.1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # react router app
      - 9998:9998
    networks:
      - fs-network
    depends_on:
      - rrv7front
      - postgres
      - backend
    container_name: reverseproxy
networks:
  fs-network:
    driver: bridge
    name: fs-network
