services:
  rrv7front:
    image: fullstack-project-dev
    volumes:
      - ./app:/usr/src/fullstack-project/app
      - ./package.json:/usr/src/fullstack-project/package.json
      - ./package-lock.json:/usr/src/fullstack-project/package-lock.json
    build:
      dockerfile: dev.Dockerfile
    networks:
      - fs-network
    container_name: rrv7front
  reverseproxy:
    image: nginx:1.20.1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 9998:9998
    networks:
      - fs-network
    depends_on:
      - rrv7front
    container_name: reverseproxy
networks:
  fs-network:
    driver: bridge
    name: fs-network
