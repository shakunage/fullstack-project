services:
  rrv7front:
    image: fullstack-project-dev
    volumes:
      - ./app:/usr/src/fullstack-project/app
      - ./prisma:/usr/src/fullstack-project/prisma
      - ./package.json:/usr/src/fullstack-project/package.json
      - ./package-lock.json:/usr/src/fullstack-project/package-lock.json
    build:
      dockerfile: dev.Dockerfile
    networks:
      - fs-network
    container_name: rrv7front
  postgres:
    image: postgres:17.4
    env_file:
      - ./postgres/.env
    volumes:
      - ./postgres/postgres_data:/var/lib/postgresql/data
    networks:
      - fs-network
    container_name: postgres
  reverseproxy:
    image: nginx:1.20.1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 9998:9998
    networks:
      - fs-network
    depends_on:
      - rrv7front
      - postgres
    container_name: reverseproxy
networks:
  fs-network:
    driver: bridge
    name: fs-network
