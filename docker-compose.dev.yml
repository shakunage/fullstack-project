services:
  rrv7front:
    image: fullstack-project-dev
    volumes:
      - ./frontend/app:/usr/src/fullstack-project/frontend/app
      - ./frontend/prisma:/usr/src/fullstack-project/frontend/prisma
      - ./frontend/package.json:/usr/src/fullstack-project/frontend/package.json
      - ./frontend/package-lock.json:/usr/src/fullstack-project/frontend/package-lock.json
      - ./frontend/vite.config.ts:/usr/src/fullstack-project/frontend/vite.config.ts
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    networks:
      - fs-network
    container_name: rrv7front
  postgres:
    image: postgres:17.4
    env_file:
      - ./postgres/.env
    volumes:
      - ./postgres/postgres_data:/var/lib/postgresql/data
    networks:
      - fs-network
    container_name: postgres
  reverseproxy:
    image: nginx:1.20.1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # react router app
      - 9998:9998
    networks:
      - fs-network
    depends_on:
      - rrv7front
      - postgres
    container_name: reverseproxy
  backend:
    image: node:lts-bullseye-slim
    build:
      context: './backend'
    volumes:
      - .:/usr/src/fullstack-project/backend
    ports:
      - 8080:8080
    networks:
      - fs-network
    command: ["tail",  "-f", "/dev/null"]
    container_name: backend

networks:
  fs-network:
    driver: bridge
    name: fs-network
