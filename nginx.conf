events { }

# A http server, listening at port 80
http {
  server {
    # react router v7 app
    listen 9998;
  
    # Requests starting with root (/) are handled
    location / {
      # Requests are directed to remix app
      proxy_pass http://rrv7front:5173;
      # Vite HMR config
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
    }
    
    # Requests starting with /api/ are handled to the backend
    location /api/ {
      # replace /api/ with / in the request
      rewrite ^/api/(.*)$ /$1 break;
      # Requests are directed to https://api-web.nhle.com/ (without the /api because of the rewrite)
      proxy_pass http://api-web.nhle.com/;
      proxy_redirect default;
    }
    # Requests to your backend API
    location /backend/ {
      rewrite ^/backend/(.*)$ /$1 break;
      proxy_pass http://backend:8080;
      proxy_redirect default;
    }
  }
}
