events { }

http {
  # cache options 
  proxy_cache_path /tmp/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=600s use_temp_path=off;
  proxy_cache_valid any 150s;

  # custom log format
  log_format cache_log '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      '$upstream_cache_status';
  
  access_log /var/log/nginx/access.log cache_log; # Or your preferred log path

  server {
    # react router v7 app
    listen 9998;
    
    # / is forwarded to the remix app (frontend)
    location / {
      # Requests are directed to remix app
      proxy_pass http://rrv7front:5173;
      # Vite HMR config
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
    }
    
    # /api is forwarded to the NHL API (external)
    location /api/ {
      # replace /api/ with / in the request
      rewrite ^/api/(.*)$ /$1 break;
      # Requests are directed to https://api-web.nhle.com/ (without the /api because of the rewrite)
      proxy_pass http://api-web.nhle.com/;
      proxy_cache api_cache;
      add_header X-Cache-Status $upstream_cache_status;
      add_header 'Access-Control-Expose-Headers' 'X-Cache-Status' always;
      proxy_redirect default;
    }

    # /backend is forwarded to the backend API (self-hosted)
    location /backend/ {
      rewrite ^/backend/(.*)$ /$1 break;
      proxy_pass http://backend:8080/;
      proxy_redirect default;
    }
  }
}
