services:
  rrv7front:
    image: fullstack-project-prod
    build:
      context: ./frontend
      dockerfile: prod.Dockerfile
    environment:
      SSR_BACKEND_URL: http://reverseproxy/backend
      NHL_API_URL: http://reverseproxy/api/v1
      CSR_BACKEND_URL: http://localhost/backend
    networks:
      - fs-network
    container_name: rrv7front
  postgres:
    image: postgres:17.4
    env_file:
      - ./postgres/.env
    volumes:
      - ./postgres/postgres_data:/var/lib/postgresql/data
    networks:
      - fs-network
    container_name: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  mongo:
    image: mongo
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db
    networks: # Explicitly add mongo to the network
      - fs-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  redis:
    image: "redis:alpine"
    container_name: rediscache
    networks:
      - fs-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli PING | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s # Optional: gives Redis some time to start before healthchecks begin
  backend:
    build:
      context: ./backend
      dockerfile: prod.Dockerfile
    networks:
      - fs-network
    container_name: backend-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  reverseproxy:
    image: nginx:1.20.1
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
    ports:
      # react router app
      - 80:80
    networks:
      - fs-network
    depends_on:
      backend:
        condition: service_healthy
    container_name: reverseproxy
networks:
  fs-network:
    driver: bridge
    name: fs-network
volumes:
  mongo_data:
    external: false
